pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'MsRequests'

include ':applications:app-service'
include ':domain:model'
include ':domain:usecase'
include ':infrastructure:driven-adapters:r2dbc-postgresql'
include ':infrastructure:entry-points:reactive-web'
include ':infrastructure:driven-adapters:rest-consumer'
include ':infrastructure:driven-adapters:security-provider'